<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Star Dash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: top bar (moon deco + logo left, account/help/language right), centered title + Play,
   rocket panel bottom-left, best/time/last-score strip bottom-right. Dark-only space look. */
:root {
  --bg: #060a1c;
  --panel: #0d1431;
  --panel-2: #131c42;
  --line: #28346a;
  --fg: #e9edff;
  --muted: #98a3d4;
  --accent: #ffb23f;      /* rocket flame */
  --accent-ink: #2a1500;
  --star: #facc15;
  --cyan: #4cc3ff;
  --danger: #ff7b7b;
  --f-display: "Chakra Petch", "Cairo", system-ui, sans-serif;
  --f-body: "Figtree", "Cairo", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 16px/1.5 var(--f-body);
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(1px 1px at 12% 22%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 78% 12%, #cfe3ff 99%, transparent),
    radial-gradient(1px 1px at 34% 68%, #fff 99%, transparent),
    radial-gradient(1px 1px at 90% 58%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 56% 36%, #ffe9b0 99%, transparent),
    radial-gradient(1px 1px at 6% 84%, #cfe3ff 99%, transparent),
    radial-gradient(1px 1px at 66% 90%, #fff 99%, transparent),
    radial-gradient(60% 50% at 85% 0%, rgba(76,195,255,.12), transparent 70%),
    radial-gradient(50% 45% at 5% 100%, rgba(255,178,63,.09), transparent 70%);
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.moon { width: 64px; height: 64px; flex: none; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo svg { width: 44px; height: 44px; flex: none; }
.logo b { font: 700 1.35rem/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; }
.logo b i { font-style: normal; color: var(--accent); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; position: relative; }
.tool {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  font-weight: 600; font-size: .92rem; max-width: 100%;
}
.tool:hover { border-color: var(--cyan); background: var(--panel-2); }
.tool svg { width: 20px; height: 20px; flex: none; stroke: var(--cyan); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12ch; }
.langmenu {
  position: absolute; top: calc(100% + 6px); inset-inline-end: 0; z-index: 5; min-width: 170px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
  display: grid; gap: 2px; box-shadow: 0 14px 40px rgba(0,0,0,.5);
}
.langmenu button { text-align: start; background: none; border: 0; padding: 10px 12px; border-radius: 8px; }
.langmenu button:hover, .langmenu button[aria-checked="true"] { background: var(--panel); }
.langmenu button[aria-checked="true"]::after { content: "  ✓"; color: var(--accent); }

/* hero */
.hero { display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; padding-block: 18px 4px; }
.hero h1 {
  margin: 0; font: 700 clamp(2.1rem, 7vw, 4.2rem)/1.05 var(--f-display);
  letter-spacing: .02em; text-wrap: balance; text-transform: uppercase;
}
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { margin: 0; color: var(--muted); max-width: 46ch; text-wrap: balance; }
.play {
  display: inline-flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 44px;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px;
  font: 700 1.45rem/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase;
  box-shadow: 0 6px 0 #b86f00, 0 18px 40px rgba(255,178,63,.25);
  transition: transform .12s, box-shadow .12s;
}
.play:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #b86f00, 0 22px 46px rgba(255,178,63,.35); }
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 #b86f00; }
.play svg { width: 22px; height: 22px; fill: currentColor; }

/* lower area */
.lower { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: end; }
.rocketpanel {
  min-height: 330px; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; position: relative;
  background: radial-gradient(70% 70% at 50% 85%, #1b2a66 0%, var(--panel) 65%);
  display: grid; place-items: center;
}
.rocketpanel svg.big { width: min(240px, 60%); height: auto; filter: drop-shadow(0 0 30px rgba(76,195,255,.25)); animation: bob 4.5s ease-in-out infinite; }
.rocketpanel .flame { transform-origin: 50px 76px; animation: flick .18s ease-in-out infinite alternate; }
.rocketpanel .sparkle { position: absolute; fill: var(--star); animation: tw 3s ease-in-out infinite; }
.sparkle.a { top: 14%; left: 12%; width: 22px; }
.sparkle.b { top: 30%; right: 14%; width: 14px; animation-delay: -1s; }
.sparkle.c { bottom: 18%; left: 20%; width: 12px; animation-delay: -2s; }
.sparkle.d { bottom: 26%; right: 22%; width: 18px; animation-delay: -.5s; }
@keyframes bob { 50% { transform: translateY(-12px) rotate(2deg); } }
@keyframes flick { to { transform: scaleY(1.22); } }
@keyframes tw { 50% { opacity: .25; transform: scale(.7); } }

.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
}
.stat { padding: 18px 12px; text-align: center; display: grid; gap: 6px; min-width: 0; }
.stat + .stat { border-inline-start: 1px solid var(--line); }
.stat dt { color: var(--muted); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; }
.stat dd { margin: 0; font: 700 clamp(1.5rem, 4vw, 2.2rem)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat:first-child dd { color: var(--star); }
.stat svg { width: 22px; height: 22px; margin: 0 auto; stroke: var(--cyan); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.stat:first-child svg { stroke: var(--star); }
.who { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: .85rem; padding: 10px 14px; border-top: 1px solid var(--line); text-align: center; }

/* modals */
.scrim {
  position: fixed; inset: 0; z-index: 20; background: rgba(3,6,18,.78); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal {
  width: min(460px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 20px; padding: 24px; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.6);
}
.modal h2 { margin: 0 0 14px; font: 700 1.4rem/1.2 var(--f-display); letter-spacing: .04em; }
.xbtn { position: absolute; top: 12px; inset-inline-end: 12px; width: 40px; height: 40px; border-radius: 10px; background: none; border: 1px solid transparent; font-size: 1.4rem; color: var(--muted); }
.xbtn:hover { border-color: var(--line); color: var(--fg); }
.howto { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.howto li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.howto .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; }
.howto .ic svg { width: 24px; height: 24px; }
kbd { font: 600 .8rem var(--f-body); background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
.tabs button { min-height: 40px; border: 0; border-radius: 9px; background: none; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--fg); }
form.acct { display: grid; gap: 12px; }
form.acct label { display: grid; gap: 6px; font-size: .88rem; color: var(--muted); }
form.acct input {
  min-height: 46px; padding: 0 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line);
  color: var(--fg); font: inherit; width: 100%;
}
form.acct input:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 0 3px rgba(76,195,255,.25); }
.btn {
  min-height: 46px; padding: 0 20px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink);
  font: 700 1rem var(--f-display); letter-spacing: .05em;
}
.btn.ghost { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); }
.msg { min-height: 1.4em; margin: 0; font-size: .9rem; color: var(--danger); }
.msg.ok { color: #7be8a6; }
.fine { color: var(--muted); font-size: .82rem; margin: 12px 0 0; }

/* game overlay */
.game {
  position: fixed; inset: 0; z-index: 30; background: #030615; display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.hud { width: min(960px, 100%); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hbtns { display: flex; gap: 8px; margin-inline-start: auto; }
.hbtns .tool { min-height: 40px; padding: 0 14px; }
.tool:disabled { opacity: .45; cursor: default; }
.cnt { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; font-size: .78rem; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 12px 2px 6px; font-size: .82rem; font-weight: 600; }
.chip .medal { width: 20px; height: 24px; }
.medal { width: 44px; height: 52px; flex: none; }
.awgrid { display: grid; gap: 10px; }
.aw { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 8px 8px; }
.aw small { display: block; color: var(--muted); line-height: 1.35; }
.aw.off b { color: var(--muted); }
.mlogo { margin-bottom: 12px; }
.cardlogo .logo svg { width: 28px; height: 28px; }
.cardlogo .logo b { font-size: 1rem; }
.toast { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 50%; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 14px; padding: 6px 16px 6px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: pop .3s ease-out; }
.toast small { display: block; color: var(--accent); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; }
.toast .medal { width: 28px; height: 34px; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -8px); } }
.facts { display: flex; gap: 10px; }
.facts span { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 16px; display: grid; gap: 2px; text-align: center; }
.facts small, .cap { color: var(--muted); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
.facts b { font: 700 1.2rem var(--f-display); font-variant-numeric: tabular-nums; }
.next { margin: 0; color: var(--muted); font-size: .9rem; }
@media (max-width: 520px) { .endcard .big { font-size: 2rem; } .endcard h2 { font-size: 1.15rem; } .cardlogo, .cap { display: none; } .endcard > div { gap: 6px; padding: 8px; } .facts span { padding: 3px 12px; } .facts b { font-size: 1.05rem; } .endcard .btn { min-height: 40px; } }
@media (max-width: 520px) { .pill { padding: 4px 11px; font-size: 1rem; } .pill small { font-size: .62rem; } }
.pill { display: inline-flex; align-items: baseline; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font: 700 1.2rem var(--f-display); font-variant-numeric: tabular-nums; }
.pill small { font: 500 .72rem var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pill.low { border-color: var(--danger); color: var(--danger); }
.stagebox { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: grid; place-items: center; }
.stagebox canvas {
  display: block; background: #050a24; border: 1px solid var(--line); border-radius: 14px;
  width: min(100%, calc((100dvh - 170px) * 4 / 3)); aspect-ratio: 4 / 3; max-width: 960px; touch-action: none;
}
.endcard {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(3,6,18,.72); border-radius: 14px;
  width: min(100%, calc((100dvh - 170px) * 4 / 3)); aspect-ratio: 4 / 3; max-width: 960px; margin: auto; text-align: center;
}
.endcard > div { display: grid; gap: 10px; justify-items: center; padding: 14px; max-height: 100%; overflow: auto; }
.endcard h2 { margin: 0; font: 700 clamp(1.4rem, 5vw, 2.4rem)/1.1 var(--f-display); }
.endcard .big { font: 700 clamp(2.6rem, 10vw, 5rem)/1 var(--f-display); color: var(--star); }
.endcard .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.badge { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 3px 12px; border-radius: 999px; font-size: .85rem; letter-spacing: .06em; }
.dpad { display: none; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 50px); gap: 6px; direction: ltr; }
.dpad button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; font-size: 1.3rem; touch-action: none; user-select: none; -webkit-user-select: none; }
.dpad button:active { background: var(--line); }
.dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; }
@media (pointer: coarse), (max-width: 720px) { .dpad { display: grid; } .stagebox canvas, .endcard { width: min(100%, calc((100dvh - 320px) * 4 / 3)); } }

@media (max-width: 760px) {
  .lower { grid-template-columns: 1fr; }
  .rocketpanel { min-height: 260px; }
  .tool span.lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .rocketpanel svg.big, .rocketpanel .flame, .rocketpanel .sparkle { animation: none; }
  .play { transition: none; }
}
[dir="rtl"] .play svg { transform: scaleX(-1); }
</style>

<div class="wrap">
  <!-- bar -->
  <header class="bar">
    <div class="brand">
      <!-- 5: moon and space decoration -->
      <svg class="moon" viewBox="0 0 64 64" aria-hidden="true">
        <defs><radialGradient id="mg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#f3f1e6"/><stop offset="1" stop-color="#9aa0bd"/></radialGradient></defs>
        <circle cx="30" cy="34" r="22" fill="url(#mg)"/>
        <circle cx="22" cy="28" r="4.5" fill="#b4b8cf"/><circle cx="37" cy="42" r="6" fill="#b4b8cf"/><circle cx="38" cy="25" r="2.6" fill="#b4b8cf"/><circle cx="24" cy="44" r="2.2" fill="#b4b8cf"/>
        <path d="M54 8l1.6 4.4L60 14l-4.4 1.6L54 20l-1.6-4.4L48 14l4.4-1.6z" fill="#facc15"/>
        <circle cx="8" cy="10" r="1.6" fill="#fff"/><circle cx="58" cy="44" r="1.3" fill="#cfe3ff"/><circle cx="10" cy="58" r="1.2" fill="#fff"/>
      </svg>
      <!-- 4: game logo -->
      <div class="logo" aria-label="Star Dash">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="20" fill="#131c42" stroke="#28346a" stroke-width="2"/>
          <ellipse cx="22" cy="24" rx="19" ry="6" fill="none" stroke="#4cc3ff" stroke-width="2" transform="rotate(-24 22 24)"/>
          <polygon points="22,8 25.4,17.6 35.6,17.6 27.4,23.6 30.4,33.2 22,27.4 13.6,33.2 16.6,23.6 8.4,17.6 18.6,17.6" fill="#facc15" stroke="#a16207" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <b>Star <i>Dash</i></b>
      </div>
    </div>
    <nav class="tools" aria-label="Menu">
      <!-- 1: create account -->
      <button class="tool" id="btnAcct" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6.5 8-6.5s7 2 8 6.5"/></svg>
        <span class="lbl" id="acctLbl" data-i18n="create">Create account</span>
      </button>
      <!-- 2: game instructions -->
      <button class="tool" id="btnHow" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.6 2.6 0 1 1 3.6 2.4c-.8.4-1.2 1-1.2 1.8"/><path d="M12 17.2h.01"/></svg>
        <span class="lbl" data-i18n="howtoBtn">How to play</span>
      </button>
      <!-- awards -->
      <button class="tool" id="btnAwards" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/></svg>
        <span class="lbl" data-i18n="awards">Awards</span><span class="cnt" id="awCount">0/7</span>
      </button>
      <!-- 3: select the language -->
      <button class="tool" id="btnLang" type="button" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.8 5.8 3.8 9s-1.2 6.2-3.8 9c-2.6-2.8-3.8-5.8-3.8-9S9.4 5.8 12 3z"/></svg>
        <span class="lbl" id="langLbl">English</span>
      </button>
      <div class="langmenu" id="langMenu" role="menu" hidden></div>
    </nav>
  </header>

  <!-- title + play -->
  <section class="hero">
    <h1 data-i18n-html="title">Explore <em>The Galaxy</em></h1>
    <p data-i18n="tag">Steer your rocket and grab as many stars as you can before 30 seconds run out.</p>
    <button class="play" id="btnPlay" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      <span data-i18n="play">Play!</span>
    </button>
  </section>

  <section class="lower">
    <!-- 6: rocket image decoration -->
    <div class="rocketpanel" aria-hidden="true">
      <svg class="sparkle a" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>
      <svg class="sparkle b" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>
      <svg class="sparkle c" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>
      <svg class="sparkle d" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>
      <svg class="big" viewBox="0 0 100 100">
        <g class="flame"><path d="M40 76 Q50 98 60 76Z" fill="#fb923c" stroke="#c2410c" stroke-width="2"/><path d="M44 76 Q50 90 56 76Z" fill="#fde047"/></g>
        <path d="M36 58 L18 80 L36 76Z M64 58 L82 80 L64 76Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="3" stroke-linejoin="round"/>

    ctx.globalAlpha = 1;
    /* deadly edge */
    ctx.save();
    ctx.shadowColor = "#ff3b3b"; ctx.shadowBlur = 10; ctx.strokeStyle = "rgba(255,70,70," + (.7 + .25 * Math.sin(G.t * 5)) + ")"; ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, W - 4, H - 4);
    ctx.restore();
    if (!G.over) {
      var sz = 32 * (1 + .08 * Math.sin(G.t * 5));
      if (imgStar.complete) ctx.drawImage(imgStar, W / 2 + G.sx - sz / 2, H / 2 - G.sy - sz / 2, sz, sz);
    }
    G.hz.forEach(function (h) { if (h.k === "bomb") drawBomb(h); else drawEnemy(h); });
    G.parts.forEach(function (p) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(W / 2 + p.x - p.s / 2, H / 2 - p.y - p.s / 2, p.s, p.s); });
    ctx.globalAlpha = 1;
    if (!G.lost) {
      ctx.save(); ctx.translate(W / 2 + G.rx, H / 2 - G.ry); ctx.rotate(G.ang * Math.PI / 180);
      if (G.grace > 0) ctx.globalAlpha = .55 + .35 * Math.sin(G.t * 24);
      if (imgRocket.complete) ctx.drawImage(imgRocket, -G.size / 2, -G.size / 2, G.size, G.size);
      ctx.restore();
    }
    ctx.restore();
    if (G.banner > 0 && !G.over) {
      ctx.save(); ctx.globalAlpha = Math.min(1, G.banner); ctx.textAlign = "center";
      ctx.font = "700 34px 'Chakra Petch', 'Cairo', system-ui, sans-serif"; ctx.fillStyle = "#ffb23f";
      ctx.fillText(T("lvlUp") + G.lvl, W / 2, H / 2 - 40);
      ctx.font = "600 18px 'Figtree', 'Cairo', system-ui, sans-serif"; ctx.fillStyle = "#e9edff";
      ctx.fillText("+" + BONUS + " s", W / 2, H / 2 - 16);
      ctx.restore();
    }
  }

  function setKey(k, v) { if (k in keys) keys[k] = v; }
  var map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", W: "up", s: "down", S: "down", a: "left", A: "left", d: "right", D: "right" };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!$("scrim").hidden) closeModal();
      else if (!$("game").hidden) { if (G.on) togglePause(); else closeGame(); }
      else { $("langMenu").hidden = true; }
      return;
    }
    if ($("game").hidden) return;
    if (e.key === "p" || e.key === "P") { e.preventDefault(); togglePause(); return; }
    if (!map[e.key]) return;
    e.preventDefault(); setKey(map[e.key], 1);
  });
  document.addEventListener("keyup", function (e) { if (map[e.key]) setKey(map[e.key], 0); });
  window.addEventListener("blur", function () { keys.up = keys.down = keys.left = keys.right = 0; });
  document.addEventListener("visibilitychange", function () { if (document.hidden && !$("game").hidden && G.on && !G.paused) togglePause(); });
  Array.prototype.forEach.call($("dpad").querySelectorAll("button"), function (b) {
    var k = b.getAttribute("data-k");
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); setKey(k, 1); });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) { b.addEventListener(ev, function () { setKey(k, 0); }); });
  });
  $("btnPlay").onclick = openGame;
  $("gPause").onclick = togglePause;
  $("resume").onclick = togglePause;
  $("gStop").onclick = function () { if (G.on) { if (G.dying > 0) G.dying = .0001; else finish(); } };
  $("home").onclick = closeGame;
  $("home2").onclick = closeGame;
  $("again").onclick = start;
  $("lvGo").onclick = resumeFromLevel;
  $("btnAwards").onclick = awardsModal;
  document.querySelectorAll(".cardlogo").forEach(function (n) { n.innerHTML = LOGO; });

  applyLang();
})();
</script>
